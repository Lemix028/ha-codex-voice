name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install component test dependencies
        run: uv sync --extra test --extra lint
      - name: Lint and format
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Typecheck Computer session and diagnostic modules
        run: uv run mypy --follow-imports=silent custom_components/codex_voice/api.py custom_components/codex_voice/llm_tools.py custom_components/codex_voice/realtime_tools.py custom_components/codex_voice/conversation.py custom_components/codex_voice/conversation_sessions.py custom_components/codex_voice/json_serialization.py custom_components/codex_voice/metrics.py custom_components/codex_voice/context_policy.py custom_components/codex_voice/tool_policy.py custom_components/codex_voice/local_intents.py custom_components/codex_voice/personal_knowledge.py custom_components/codex_voice/web_research.py scripts/collect_assist_trace.py
      - name: Test Home Assistant component
        run: uv run pytest tests/component --cov=custom_components --cov-report=term-missing
      - name: Test bridge
        run: uv run pytest -p no:homeassistant tests/bridge --cov=bridge --cov-report=term-missing

  homeassistant-2026-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install HA 2026.10 compatibility dependencies
        run: |
          uv venv --python 3.14
          uv pip install -r requirements-ha-2026.10.txt
      - name: Test HA 2026.10 normal Assist and retained component features
        run: uv run --no-project pytest tests/component

  bridge-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standalone bridge test dependencies
        run: python -m pip install -r bridge/requirements-dev.txt
      - name: Compile bridge with the minimum Python version
        run: python -m compileall -q bridge device/thirdreality scripts
      - name: Test bridge with the minimum Python version
        run: python -m pytest -p no:homeassistant tests/bridge
