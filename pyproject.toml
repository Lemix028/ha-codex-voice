[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-codex-voice-development"
version = "0.8.1"
description = "Development tooling for the Codex Voice Home Assistant integration"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
bridge = [
  "aiohttp>=3.10,<4",
  "aiortc>=1.15,<2",
  "av>=17.1,<18",
]
test = [
  "aiortc>=1.15,<2",
  "av>=17.1,<18",
  "ha-ffmpeg==3.2.2",
  "hassil==3.11.0",
  "homeassistant==2026.8.0",
  "home-assistant-intents==2026.7.30",
  "mutagen==1.48.1",
  "pytest>=8.4",
  "pytest-aiohttp>=1.1",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "pytest-homeassistant-custom-component>=0.13.300",
  "wyoming==1.10.0",
]
lint = [
  "mypy>=1.17",
  "ruff>=0.12",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests/component"]
markers = [
  "integration: requires a local Codex login and network access",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".git"]

[tool.ruff.per-file-target-version]
"bridge/**/*.py" = "py311"
"device/thirdreality/**/*.py" = "py311"
"scripts/**/*.py" = "py311"
"tests/bridge/**/*.py" = "py311"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "BLE",
  "C",
  "D",
  "E",
  "F",
  "FLY",
  "FURB",
  "G",
  "I",
  "INP",
  "ISC",
  "LOG",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S102",
  "S103",
  "S107",
  "S108",
  "S301",
  "S306",
  "S307",
  "S313",
  "S314",
  "S315",
  "S316",
  "S317",
  "S318",
  "S319",
  "S601",
  "S602",
  "S604",
  "S608",
  "S609",
  "SIM",
  "SLF",
  "SLOT",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "ASYNC109",
  "ASYNC110",
  "ASYNC240",
  "B008",
  "B019",
  "COM812",
  "D202",
  "D203",
  "D213",
  "D406",
  "D407",
  "D417",
  "E501",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "PLW0108",
  "PLW1641",
  "PLW2901",
  "PT011",
  "PT018",
  "RUF001",
  "RUF012",
  "RUF015",
  "SIM102",
  "SIM103",
  "SIM108",
  "SIM115",
  "TC001",
  "TC002",
  "TC003",
  "TC006",
  "TRY003",
  "TRY400",
  "UP047",
  "UP049",
]

[tool.ruff.lint.per-file-ignores]
"deploy/systemd/*.py" = ["INP001"]
"bridge/**/*.py" = ["D100", "D101", "D102", "D103", "D105", "D107"]
"scripts/**/*.py" = ["D102", "D107", "T201"]
"tests/bridge/**/*.py" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  "S101",
  "SLF001",
]
"tests/**/*.py" = ["S101", "SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
